# Global costmap — 双激光融合 + 静态地图层
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      robot_radius: 0.35
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        enabled: true
        subscribe_to_updates: true
        transform_tolerance: 0.5
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: laser_front_scanner laser_rear_scanner
        laser_front_scanner:
          topic: /scan_front
          sensor_frame: lidar_front
          data_type: LaserScan
          expected_update_rate: 0.3
          observation_persistence: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_range: 25.0
          raytrace_range: 26.0
          marking: true
          clearing: true
        laser_rear_scanner:
          topic: /scan_rear
          sensor_frame: lidar_rear
          data_type: LaserScan
          expected_update_rate: 0.3
          observation_persistence: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_range: 25.0
          raytrace_range: 26.0
          marking: true
          clearing: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55