# Local costmap — 双激光融合 (front + rear)
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.35
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: laser_front_scanner laser_rear_scanner
        laser_front_scanner:
          topic: /scan_front
          sensor_frame: lidar_front
          data_type: LaserScan
          expected_update_rate: 0.3
          observation_persistence: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_range: 25.0
          raytrace_range: 26.0
          marking: true
          clearing: true
        laser_rear_scanner:
          topic: /scan_rear
          sensor_frame: lidar_rear
          data_type: LaserScan
          expected_update_rate: 0.3
          observation_persistence: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_range: 25.0
          raytrace_range: 26.0
          marking: true
          clearing: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
        enabled: true