name: AGV V0.1 Sim CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install ROS2 Humble
        run: |
          sudo apt update
          sudo apt install -y software-properties-common
          sudo add-apt-repository universe
          sudo apt update
          sudo apt install -y \
            ros-humble-ros-base \
            ros-humble-nav2-bringup \
            ros-dev-tools \
            python3-colcon-common-extensions \
            python3-pytest \
            python3-yaml

      - name: Build
        working-directory: .
        run: |
          source /opt/ros/humble/setup.bash
          bash scripts/build.sh

      - name: Unit tests (offline)
        working-directory: .
        run: |
          source /opt/ros/humble/setup.bash
          source ros2_ws/install/setup.bash
          export PYTHONPATH="ros2_ws/src/agv_control:ros2_ws/src/agv_mission:ros2_ws/src/agv_lidar:ros2_ws/src/agv_ultrasonic:ros2_ws/src/agv_simulation:ros2_ws/src/agv_vision_mock:ros2_ws/src/agv_tf:${PYTHONPATH:-}"
          python3 -m pytest \
            ros2_ws/src/agv_control/agv_control/tests \
            ros2_ws/src/agv_mission/agv_mission/tests \
            ros2_ws/src/agv_lidar/agv_lidar/tests \
            ros2_ws/src/agv_ultrasonic/agv_ultrasonic/tests \
            ros2_ws/src/agv_simulation/agv_simulation/tests \
            ros2_ws/src/agv_vision_mock/agv_vision_mock/tests \
            ros2_ws/src/agv_safety/agv_safety/tests \
            -v --tb=short

      - name: Smoke cmd_vel (offline)
        working-directory: .
        run: |
          source /opt/ros/humble/setup.bash
          source ros2_ws/install/setup.bash
          export AGV_BACKEND=mock
          export REAL_ROBOT_ENABLED=false
          timeout 12 ros2 run agv_control agv_control_bridge \
            --ros-args -p backend:=mock -p publish_hz:=20.0 &
          sleep 4
          ros2 topic pub --once /cmd_vel geometry_msgs/msg/Twist \
            "{linear: {x: 0.3}, angular: {z: 0.0}}"
          ros2 topic echo --once /odom
          pkill -f agv_control_bridge || true
